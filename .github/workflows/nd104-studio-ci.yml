# Tests and lints nd104-studio on every push and pull request that touches it.
name: ND104 Studio CI

on:
  push:
    branches: [main, linux-port]
    paths: ["apps/nd104-studio/**", ".github/workflows/nd104-studio-*.yml"]
  pull_request:
    paths: ["apps/nd104-studio/**", ".github/workflows/nd104-studio-*.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nd104-studio
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nd104-studio

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nd104-studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run check

      - name: Frontend build (embedded into the app and the setup)
        run: |
          npm run build
          npm run build:installer-ui

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Third-party notices up to date
        run: python scripts/third_party_notices.py --check

  # The Linux port (docs/linux-port.md): builds, lints and tests on the
  # oldest supported base (Ubuntu 22.04, glibc 2.35). The Windows setup
  # (crate nd104-studio-setup) is Windows-only and not built here.
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/nd104-studio
    steps:
      - uses: actions/checkout@v5

      - name: System libraries (WebKitGTK, tray, D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nd104-studio

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nd104-studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run check

      - name: Frontend build (embedded into the app)
        run: npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude nd104-studio-setup --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude nd104-studio-setup --locked

      # the notices cover both targets and are generated from either host
      - name: Third-party notices up to date
        run: python3 scripts/third_party_notices.py --check

      # Packaging check: bundle a debug .deb (the same bundler step as the
      # release, at a fraction of the time) and assert what bit us before -
      # the udev rule and the maintainer scripts must be in the package. The
      # AppImage is left to the release workflow (linuxdeploy download).
      - name: Package check (.deb)
        run: |
          npx tauri build --debug --bundles deb
          deb=$(ls target/debug/bundle/deb/*.deb)
          dpkg-deb -c "$deb" | grep -q 'usr/lib/udev/rules.d/70-nd104-studio.rules'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qE '(^|/)postinst$'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qE '(^|/)postrm$'
          dpkg-deb -f "$deb" Depends
