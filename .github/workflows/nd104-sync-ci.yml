# Tests and lints nd104-sync on every push and pull request that touches it.
name: nd104-sync CI

on:
  push:
    branches: [main]
    paths: ["apps/nd104-sync/**", ".github/workflows/nd104-sync-*.yml"]
  pull_request:
    paths: ["apps/nd104-sync/**", ".github/workflows/nd104-sync-*.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nd104-sync
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nd104-sync

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nd104-sync/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run check

      - name: Frontend build (embedded into the app)
        run: npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
