# Builds and publishes an nd104-sync release when a tag nd104-sync-vX.Y.Z is pushed.
# Release notes = the matching "## [X.Y.Z]" section of apps/nd104-sync/CHANGELOG.md.
# 0.x versions are published as beta (title), but not as GitHub pre-release,
# so the app update check finds them. Versions with a suffix (X.Y.Z-rc.1) are
# published as pre-release and ignored by the update check.
name: nd104-sync release

on:
  push:
    tags: ["nd104-sync-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/nd104-sync
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nd104-sync

      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#nd104-sync-v}"
          CARGO_VERSION=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "VERSION=$CARGO_VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Package
        run: |
          NAME="nd104-sync-${VERSION}-windows-x64"
          mkdir -p "dist/$NAME"
          cp target/release/nd104-cli.exe target/release/nd104-probe.exe \
             README.md CHANGELOG.md ../../LICENSE "dist/$NAME/"
          cd dist
          7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          echo "PACKAGE=$NAME" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG
        run: |
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "::error::No section '## [${VERSION}]' in CHANGELOG.md"
            exit 1
          fi
          cat >> dist/notes.md <<EOF

          ---
          **Download:** \`${PACKAGE}.zip\` (Windows 10/11, x64). Extract it anywhere and
          run \`nd104-cli.exe\` – see the README inside. Wired USB connection only.
          Verify the download with \`${PACKAGE}.zip.sha256\`.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="nd104-sync ${VERSION}"
          FLAGS=""
          case "$VERSION" in
            *-*) FLAGS="--prerelease"; TITLE="$TITLE (pre-release)" ;;
            0.*) TITLE="$TITLE (beta)" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/${PACKAGE}.zip" "dist/${PACKAGE}.zip.sha256" \
            --title "$TITLE" --notes-file dist/notes.md $FLAGS
