# Renders the README screenshots of the nd104-sync settings window from the
# demo build (sample data, no keyboard) and commits them when they changed.
# Runs on Windows so the window uses the real Segoe UI font.
name: nd104-sync screenshots

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "apps/nd104-sync/ui/**"
      - "apps/nd104-sync/locales/**"
      - "apps/nd104-sync/scripts/screenshots.mjs"
      - "apps/nd104-sync/vite.config.ts"
      - "apps/nd104-sync/Cargo.toml"
      - ".github/workflows/nd104-sync-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/nd104-sync
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nd104-sync/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright (not a project dependency)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium

      - name: Demo build
        run: npm run build:demo

      - name: Take screenshots
        run: npm run screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: nd104-sync-screenshots
          path: docs/images/nd104-sync/*.png

      - name: Commit changed screenshots
        working-directory: .
        run: |
          git add docs/images/nd104-sync/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nd104-sync screenshots"
          git push
