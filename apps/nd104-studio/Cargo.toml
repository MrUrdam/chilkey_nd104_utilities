[workspace]
resolver = "2"
members = [
    "crates/nd104-protocol",
    "crates/nd104-probe",
    "crates/nd104-core",
    "crates/nd104-cli",
    "src-tauri",
    "installer",
]

[workspace.package]
version = "2.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/MrUrdam/chilkey_nd104_utilities"
rust-version = "1.80"

[workspace.dependencies]
nd104-protocol = { path = "crates/nd104-protocol" }
nd104-core = { path = "crates/nd104-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
jiff = { version = "0.2", features = ["serde"] }
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
