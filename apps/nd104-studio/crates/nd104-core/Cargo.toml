[package]
name = "nd104-core"
description = "Core of ND104 Studio: keyboard models, device manager, firmware guard, clock, weather, lighting, picture, keymap, scheduler, config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nd104-protocol.workspace = true
anyhow.workspace = true
directories.workspace = true
hidapi.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
jiff.workspace = true
keyring.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
]
