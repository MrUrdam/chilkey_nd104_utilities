<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ND104 Studio: a keycap carrying the keyboard's screen, its knob and the
       light bar – display, keymap and lighting in one mark. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b313b"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="0.55" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#ece6f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a93b"/>
      <stop offset="1" stop-color="#b8f53d"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#1c2028"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#0b0d10"/>
  <rect x="112" y="104" width="800" height="780" rx="160" fill="url(#cap)" stroke="#3b4350" stroke-width="12"/>
  <!-- screen with sun and temperature, like the display -->
  <rect x="196" y="236" width="500" height="320" rx="52" fill="url(#screen)"/>
  <circle cx="330" cy="370" r="62" fill="#f2a93b"/>
  <rect x="430" y="330" width="200" height="36" rx="18" fill="#474b53"/>
  <rect x="430" y="398" width="130" height="26" rx="13" fill="#8a8f98"/>
  <rect x="236" y="474" width="120" height="22" rx="11" fill="#b4b2a9"/>
  <!-- knob -->
  <circle cx="790" cy="300" r="66" fill="url(#knob)" stroke="#5a6475" stroke-width="10"/>
  <rect x="782" y="246" width="16" height="48" rx="8" fill="#eef3f8"/>
  <!-- light bar -->
  <rect x="196" y="660" width="632" height="52" rx="26" fill="url(#bar)"/>
</svg>
